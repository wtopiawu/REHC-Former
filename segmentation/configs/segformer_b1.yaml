# SegFormer-B1 binary semantic segmentation config for gripper mask training.
# Image size is [height, width]. Example RGB resolution: [480, 640].

seed: 42

model:
  # ADE20K checkpoint gives a pretrained MiT-B1 encoder and pretrained segmentation head.
  # The final classifier is resized to 2 classes with ignore_mismatched_sizes=True.
  name: "nvidia/segformer-b1-finetuned-ade-512-512"
  cache_dir: ".hf_cache/transformers"
  local_files_only: false
  num_classes: 2
  class_names: ["background", "gripper"]

paths:
  train_images: "data/gripper/images/train"
  train_masks: "data/gripper/masks/train"
  val_images: "data/gripper/images/val"
  val_masks: "data/gripper/masks/val"
  output_dir: "outputs/segformer_b1_gripper"

input:
  image_size: [480, 640]
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]
  # If your mask is 0/255, set true. Values >0 become foreground class 1.
  binary_mask: true

train:
  epochs: 120
  batch_size: 8
  num_workers: 4
  learning_rate: 0.00006
  weight_decay: 0.01
  warmup_epochs: 5
  min_lr: 0.000001
  amp: true
  grad_clip_norm: 1.0
  gradient_accumulation_steps: 1
  save_every: 10
  early_stop_patience: 25
  resume: ""

loss:
  ce_weight: 0.5
  dice_weight: 0.5
  # Set a larger foreground weight if the gripper occupies a small image area.
  class_weights: [1.0, 2.0]
  ignore_index: 255

augment:
  enabled: true
  horizontal_flip_p: 0.5
  rotate_limit: 15
  shift_limit: 0.05
  scale_limit: 0.15
  brightness_contrast_p: 0.4
  blur_p: 0.15
  noise_p: 0.15
  coarse_dropout_p: 0.2

infer:
  threshold: 0.5
  min_area: 200
  fill_holes: true
